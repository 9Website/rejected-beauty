<label class="soda-toggle">
  <input
    type="checkbox"
    class="soda-input"
    aria-label="Soda can tab toggle switch"
  />
  <div class="can-top">
    <div class="can-ridge ridge-1"></div>
    <div class="can-ridge ridge-2"></div>
    <div class="can-ridge ridge-3"></div>

    <div class="opening"></div>

    <div class="fizz-container">
      <div class="bubble b1"></div>
      <div class="bubble b2"></div>
      <div class="bubble b3"></div>
      <div class="bubble b4"></div>
      <div class="bubble b5"></div>
      <div class="bubble b6"></div>
    </div>

    <div class="tab-assembly">
      <div class="rivet"></div>
      <div class="tab-lever">
        <div class="tab-hole"></div>
        <div class="tab-highlight"></div>
      </div>
    </div>
  </div>
</label>
